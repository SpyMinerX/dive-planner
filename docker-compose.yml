# Local development: the app plus a throwaway PostgreSQL.
# Production runs on AegisMesh via stack.portainer.yml.
services:
  dive-app:
    build: .
    image: spyminer/abyss-deco-planner:dev
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: abyss
      DB_USER: abyss
      DB_PASSWORD: abyss-dev
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: abyss
      POSTGRES_USER: abyss
      POSTGRES_PASSWORD: abyss-dev
    volumes:
      - dive-db:/var/lib/postgresql

volumes:
  dive-db:
